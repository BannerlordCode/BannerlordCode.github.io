name: Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build job - compiles docs
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Run tool regression tests
        run: npm run test:tools

      - name: Check canonical inventory evidence
        run: node tools/generate-inventory.mjs --check --require-complete

      - name: Check handwritten coverage evidence
        run: node tools/handwritten-coverage.mjs --check --require-complete

      - name: Check R1 coverage evidence
        run: node tools/r1-coverage-report.mjs --version 1.3.15 --lang zh --out tools/data/r1-coverage-report.json --gap-out tools/data/r1-gap-full.json --check --require-complete

      - name: Audit documentation quality
        run: node tools/audit-doc-quality.mjs

      - name: Audit internal links
        run: node tools/audit-links.mjs

      - name: Check section-tree freshness
        run: node tools/generate-section-tree.mjs --check

      - name: Check page-navigation freshness
        run: node tools/generate-page-navigation.mjs --check

      - name: Audit navigation invariants
        run: node tools/audit-navigation.mjs

      - name: Build Zola site
        run: zola build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: public/
          retention-days: 1

  # Deploy job - only runs on push to main
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: public

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
